<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibey & Otar's Love Diary</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #ffb6c1;
            --secondary-color: #ff69b4;
            --text-color: #333;
            --bg-color: #fff9fa;
            --card-color: #fff;
            --shadow-color: rgba(255, 105, 180, 0.2);
            --timeline-color: #ffb6c1;
        }

        .night-mode {
            --primary-color: #d23669;
            --secondary-color: #ff6b81;
            --text-color: #f8f9fa;
            --bg-color: #2d3436;
            --card-color: #3a4144;
            --shadow-color: rgba(210, 54, 105, 0.3);
            --timeline-color: #d23669;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .heart {
            position: absolute;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }

        .splash-content {
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .splash-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .splash-subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .progress-container {
            width: 80%;
            max-width: 400px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 2rem;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background-color: white;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* Lock Screen */
        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
        }

        .lock-form {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .lock-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .passkey-input {
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            width: 200px;
            margin-bottom: 1rem;
            text-align: center;
            outline: none;
        }

        .unlock-btn {
            padding: 0.8rem 2rem;
            background-color: white;
            color: #ff69b4;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .unlock-btn:hover {
            background-color: #ff69b4;
            color: white;
            transform: scale(1.05);
        }

        /* Main App */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .app-title {
            font-size: 2rem;
            color: var(--secondary-color);
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        .control-btn {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background-color: var(--secondary-color);
            transform: scale(1.05);
        }

        .music-control {
            position: relative;
        }

        .music-upload {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .entry-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .entry-form {
            background-color: var(--card-color);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 5px 15px var(--shadow-color);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .entry-title {
            font-size: 1.5rem;
            color: var(--secondary-color);
        }

        .entry-mood {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
        }

        .entry-mood option {
            background-color: white;
            color: #333;
        }

        .entry-text {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            min-height: 150px;
            resize: vertical;
            font-size: 1rem;
            margin-bottom: 1rem;
            background-color: var(--card-color);
            color: var(--text-color);
        }

        .entry-text:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px var(--shadow-color);
        }

        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .photo-upload {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .photo-label {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .photo-label:hover {
            background-color: var(--secondary-color);
        }

        .photo-input {
            display: none;
        }

        .photo-preview {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .preview-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--primary-color);
        }

        .save-btn {
            padding: 0.8rem 2rem;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .save-btn:hover {
            background-color: var(--primary-color);
            transform: scale(1.05);
        }

        /* Timeline */
        .timeline-container {
            margin-top: 3rem;
        }

        .timeline-title {
            font-size: 1.8rem;
            color: var(--secondary-color);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .timeline {
            position: relative;
            padding: 2rem 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background-color: var(--timeline-color);
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            width: 50%;
            padding: 1.5rem;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timeline-item:nth-child(odd) {
            left: 0;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
        }

        .timeline-content {
            background-color: var(--card-color);
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px var(--shadow-color);
            position: relative;
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            top: 20px;
            right: -10px;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 10px solid var(--card-color);
        }

        .timeline-item:nth-child(even) .timeline-content::before {
            right: auto;
            left: -10px;
            border-left: none;
            border-right: 10px solid var(--card-color);
        }

        .timeline-date {
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
        }

        .timeline-author {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .timeline-mood {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            border-radius: 50px;
            font-size: 0.9rem;
            margin-left: 0.5rem;
            border: 1px solid var(--primary-color);
        }

        .timeline-text {
            margin: 1rem 0;
            line-height: 1.6;
        }

        .timeline-images {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .timeline-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--primary-color);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .timeline-image:hover {
            transform: scale(1.1);
        }

        .timeline-dot {
            position: absolute;
            top: 30px;
            right: -10px;
            width: 20px;
            height: 20px;
            background-color: var(--secondary-color);
            border-radius: 50%;
            border: 3px solid var(--bg-color);
        }

        .timeline-item:nth-child(even) .timeline-dot {
            right: auto;
            left: -10px;
        }

        /* Modal for image preview */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }

            .timeline-item {
                width: 100%;
                padding-left: 70px;
                padding-right: 20px;
            }

            .timeline-item:nth-child(even) {
                left: 0;
            }

            .timeline-content::before {
                right: auto;
                left: -10px;
                border-left: none;
                border-right: 10px solid var(--card-color);
            }

            .timeline-item:nth-child(even) .timeline-content::before {
                right: auto;
                left: -10px;
                border-left: none;
                border-right: 10px solid var(--card-color);
            }

            .timeline-dot {
                left: 20px;
                right: auto;
            }

            .timeline-item:nth-child(even) .timeline-dot {
                left: 20px;
                right: auto;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
            }

            .controls {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .entry-footer {
                flex-direction: column;
                gap: 1rem;
            }

            .photo-upload {
                width: 100%;
                justify-content: space-between;
            }

            .save-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <h1 class="splash-title">Sibey & Otar</h1>
            <p class="splash-subtitle">Our Love Diary</p>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <!-- Lock Screen -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-form">
            <h2 class="lock-title">Our Secret Diary</h2>
            <input type="password" class="passkey-input" id="passkeyInput" placeholder="Enter Passkey">
            <button class="unlock-btn" id="unlockBtn">Unlock</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="container" id="appContainer">
        <div class="header">
            <h1 class="app-title">Sibey & Otar's Love Diary</h1>
            <div class="controls">
                <button class="control-btn" id="nightModeBtn">
                    <span id="nightModeIcon">🌙</span> Night Mode
                </button>
                <button class="control-btn" id="exportBtn">
                    <span>📄</span> Export PDF
                </button>
                <div class="control-btn music-control">
                    <span id="musicIcon">🎵</span> Music
                    <input type="file" class="music-upload" id="musicUpload" accept="audio/*">
                </div>
                <audio id="backgroundMusic" loop></audio>
            </div>
        </div>

        <div class="entry-container">
            <div class="entry-form">
                <div class="entry-header">
                    <h2 class="entry-title" id="entryTitle">Sibey's Entry</h2>
                    <select class="entry-mood" id="entryMood">
                        <option value="Happy">Happy</option>
                        <option value="Romantic">Romantic</option>
                        <option value="Missing You">Missing You</option>
                        <option value="Excited">Excited</option>
                        <option value="Grateful">Grateful</option>
                        <option value="Playful">Playful</option>
                        <option value="Thoughtful">Thoughtful</option>
                    </select>
                </div>
                <textarea class="entry-text" id="entryText" placeholder="Write your thoughts here..."></textarea>
                <div class="entry-footer">
                    <div class="photo-upload">
                        <label for="photoInput" class="photo-label">📷 Add Photos</label>
                        <input type="file" class="photo-input" id="photoInput" accept="image/*" multiple>
                        <div class="photo-preview" id="photoPreview"></div>
                    </div>
                    <button class="save-btn" id="saveBtn">Save Entry</button>
                </div>
            </div>
        </div>

        <div class="timeline-container">
            <h2 class="timeline-title">Our Love Timeline</h2>
            <div class="timeline" id="timeline"></div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal" id="imageModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="modal-content">
            <img class="modal-image" id="modalImage">
        </div>
    </div>

    <script>
        // Create floating hearts
        function createHearts() {
            const colors = ['#ffb6c1', '#ff69b4', '#ff8fab', '#fb6f92', '#ffc2d1'];
            const body = document.body;
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 10 + 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                body.appendChild(heart);
            }
        }

        // Splash screen animation
        function showSplashScreen() {
            const progressBar = document.getElementById('progressBar');
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    document.getElementById('splashScreen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('splashScreen').style.display = 'none';
                        document.getElementById('lockScreen').style.display = 'flex';
                    }, 500);
                } else {
                    width++;
                    progressBar.style.width = width + '%';
                }
            }, 30);
        }

        // Lock screen functionality - FIXED VERSION
        function setupLockScreen() {
            const unlockBtn = document.getElementById('unlockBtn');
            const passkeyInput = document.getElementById('passkeyInput');
            
            unlockBtn.addEventListener('click', () => {
                if (passkeyInput.value === '25') {
                    document.getElementById('lockScreen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('lockScreen').style.display = 'none';
                        document.getElementById('appContainer').style.display = 'block';
                        document.getElementById('entryText').focus();
                        loadEntries();
                    }, 500);
                } else {
                    alert('Incorrect passkey. The correct passkey is 25');
                    passkeyInput.value = '';
                    passkeyInput.focus();
                }
            });
            
            passkeyInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    unlockBtn.click();
                }
            });
        }

        // Night mode toggle
        function setupNightMode() {
            const nightModeBtn = document.getElementById('nightModeBtn');
            const nightModeIcon = document.getElementById('nightModeIcon');
            let isNightMode = localStorage.getItem('nightMode') === 'true';
            
            if (isNightMode) {
                document.body.classList.add('night-mode');
                nightModeIcon.textContent = '☀️';
            }
            
            nightModeBtn.addEventListener('click', () => {
                isNightMode = !isNightMode;
                document.body.classList.toggle('night-mode');
                nightModeIcon.textContent = isNightMode ? '☀️' : '🌙';
                localStorage.setItem('nightMode', isNightMode);
            });
        }

        // Music controls
        function setupMusicControls() {
            const musicUpload = document.getElementById('musicUpload');
            const backgroundMusic = document.getElementById('backgroundMusic');
            const musicIcon = document.getElementById('musicIcon');
            let isPlaying = false;
            
            musicUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const objectURL = URL.createObjectURL(file);
                    backgroundMusic.src = objectURL;
                    backgroundMusic.play()
                        .then(() => {
                            isPlaying = true;
                            musicIcon.textContent = '🔊';
                        })
                        .catch(error => {
                            console.error('Autoplay prevented:', error);
                            musicIcon.textContent = '🔇';
                        });
                }
            });
            
            musicIcon.addEventListener('click', () => {
                if (backgroundMusic.src) {
                    if (isPlaying) {
                        backgroundMusic.pause();
                        musicIcon.textContent = '🔇';
                    } else {
                        backgroundMusic.play()
                            .then(() => {
                                musicIcon.textContent = '🔊';
                            })
                            .catch(error => {
                                console.error('Playback failed:', error);
                            });
                    }
                    isPlaying = !isPlaying;
                } else {
                    alert('Please upload music first');
                }
            });
        }

        // Photo upload and preview
        function setupPhotoUpload() {
            const photoInput = document.getElementById('photoInput');
            const photoPreview = document.getElementById('photoPreview');
            let uploadedPhotos = [];
            
            photoInput.addEventListener('change', (e) => {
                const files = e.target.files;
                uploadedPhotos = [];
                photoPreview.innerHTML = '';
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();
                    
                    reader.onload = (event) => {
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        img.classList.add('preview-image');
                        photoPreview.appendChild(img);
                        uploadedPhotos.push(event.target.result);
                    };
                    
                    reader.readAsDataURL(file);
                }
            });
            
            return () => uploadedPhotos;
        }

        // Save entry to localStorage
        function saveEntry() {
            const saveBtn = document.getElementById('saveBtn');
            const entryText = document.getElementById('entryText');
            const entryMood = document.getElementById('entryMood');
            const entryTitle = document.getElementById('entryTitle');
            const getUploadedPhotos = setupPhotoUpload();
            let isSibeyEntry = true;
            
            saveBtn.addEventListener('click', () => {
                const text = entryText.value.trim();
                if (!text) {
                    alert('Please write something before saving');
                    return;
                }
                
                const entry = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }),
                    author: isSibeyEntry ? 'Sibey' : 'Otar',
                    mood: entryMood.value,
                    text: text,
                    photos: getUploadedPhotos()
                };
                
                let entries = JSON.parse(localStorage.getItem('diaryEntries') || [];
                entries.push(entry);
                localStorage.setItem('diaryEntries', JSON.stringify(entries));
                
                // Reset form
                entryText.value = '';
                document.getElementById('photoPreview').innerHTML = '';
                document.getElementById('photoInput').value = '';
                
                // Toggle author for next entry
                isSibeyEntry = !isSibeyEntry;
                entryTitle.textContent = isSibeyEntry ? 'Sibey\'s Entry' : 'Otar\'s Entry';
                
                // Reload timeline
                loadEntries();
                
                // Focus back on textarea
                entryText.focus();
            });
        }

        // Load entries from localStorage and display in timeline
        function loadEntries() {
            const timeline = document.getElementById('timeline');
            const entries = JSON.parse(localStorage.getItem('diaryEntries')) || [];
            
            timeline.innerHTML = '';
            
            entries.sort((a, b) => b.id - a.id).forEach((entry, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.classList.add('timeline-item');
                
                const timelineContent = document.createElement('div');
                timelineContent.classList.add('timeline-content');
                
                const timelineDot = document.createElement('div');
                timelineDot.classList.add('timeline-dot');
                
                const timelineDate = document.createElement('div');
                timelineDate.classList.add('timeline-date');
                timelineDate.textContent = entry.date;
                
                const timelineAuthor = document.createElement('span');
                timelineAuthor.classList.add('timeline-author');
                timelineAuthor.textContent = entry.author;
                
                const timelineMood = document.createElement('span');
                timelineMood.classList.add('timeline-mood');
                timelineMood.textContent = entry.mood;
                
                const timelineText = document.createElement('div');
                timelineText.classList.add('timeline-text');
                timelineText.textContent = entry.text;
                
                const timelineImages = document.createElement('div');
                timelineImages.classList.add('timeline-images');
                
                if (entry.photos && entry.photos.length > 0) {
                    entry.photos.forEach(photo => {
                        const img = document.createElement('img');
                        img.src = photo;
                        img.classList.add('timeline-image');
                        img.addEventListener('click', () => {
                            document.getElementById('modalImage').src = photo;
                            document.getElementById('imageModal').style.display = 'flex';
                        });
                        timelineImages.appendChild(img);
                    });
                }
                
                timelineContent.appendChild(timelineDate);
                timelineContent.appendChild(timelineAuthor);
                timelineContent.appendChild(timelineMood);
                timelineContent.appendChild(timelineText);
                timelineContent.appendChild(timelineImages);
                
                timelineItem.appendChild(timelineContent);
                timelineItem.appendChild(timelineDot);
                
                timeline.appendChild(timelineItem);
            });
        }

        // Export to PDF
        function setupExportToPDF() {
            const { jsPDF } = window.jspdf;
            const exportBtn = document.getElementById('exportBtn');
            
            exportBtn.addEventListener('click', () => {
                const timeline = document.getElementById('timeline');
                
                html2canvas(timeline).then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const imgWidth = 210;
                    const pageHeight = 295;
                    const imgHeight = canvas.height * imgWidth / canvas.width;
                    let heightLeft = imgHeight;
                    let position = 0;
                    
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                    
                    while (heightLeft >= 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }
                    
                    pdf.save('Sibey_and_Otar_Diary.pdf');
                });
            });
        }

        // Image modal
        function setupImageModal() {
            const modal = document.getElementById('imageModal');
            const closeModal = document.getElementById('closeModal');
            
            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            createHearts();
            showSplashScreen();
            setupLockScreen();
            setupNightMode();
            setupMusicControls();
            saveEntry();
            setupExportToPDF();
            setupImageModal();
        });
    </script>
</body>
